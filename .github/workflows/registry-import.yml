name: registry-import

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: verx/verx
          path: verx
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: run importer
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd verx
          go run ./tools/importer all --config tools/importer/config.yaml --out /tmp/registry-out
          ls -R /tmp/registry-out | head -50
      - name: checkout registry
        uses: actions/checkout@v4
        with:
          repository: verx/registry
          path: registry
          token: ${{ secrets.REGISTRY_PAT }}
      - name: copy manifests
        run: |
          cp -r /tmp/registry-out/manifests/. registry/manifests/
          cd registry
          git status --short | head -30
      - name: create PR
        uses: peter-evans/create-pull-request@v7
        with:
          path: registry
          token: ${{ secrets.REGISTRY_PAT }}
          branch: bot/import-${{ github.run_number }}
          title: "bot: registry import ${{ github.run_number }}"
          body: "Scoop/Winget/GitHub 自动转制，有变化才提。hash 全部真实，CI 会跑 manifest 校验。"
          commit-message: "bot: import manifests"
