# verx registry-importer 全量配置
# all 模式按此文件跑：Scoop 批量 + Winget 批量 + GitHub Top 精选。
# 全部产物只写 manifests/<name>/<name>.yaml，registry.yaml 不动。

# A. Scoop 批量转制：bucket 可写 owner/repo（默认 ScoopInstaller/Main 可简写 Main）
scoopBuckets:
  # Scoop 官方主桶，先跑 20 个常用 app 做首批
  - repo: ScoopInstaller/Main
    apps: [7zip, git, ripgrep, fd, fzf, bat, eza, jq, yq, curl, wget, aria2, neovim, starship, lazygit, delta, gh, bottom, dust, zoxide]
  - repo: ScoopInstaller/Extras
    apps: [vscode, windows-terminal, powertoys]

# B. Winget 批量转制：PackageIdentifier 列表，自动取最新版
wingetPackages:
  - BurntSushi.Ripgrep.MSVC
  - Git.Git
  - Neovim.Neovim
  - Starship.Starship
  - ajeetdsouza.zoxide
  - sharkdp.fd
  - sharkdp.bat
  - junegunn.fzf
  - jqlang.jq

# C. GitHub Top100 精选：repo + verx 名 + 资产映射模板
# assetMap: 平台 -> 资产名包含的关键字（任一命中即选）；binMap: 平台 -> bin 入口
githubTop:
  - repo: BurntSushi/ripgrep
    name: ripgrep
    display: ripgrep
    description: 超快 grep 替代
    homepage: https://github.com/BurntSushi/ripgrep
    license: MIT
    assetMap:
      windows/amd64: [pc-windows-msvc.zip, win64.zip, windows-x86_64.zip]
      darwin/amd64: [apple-darwin.tar.gz, macos-x86_64.tar.gz]
      darwin/arm64: [aarch64-apple-darwin.tar.gz, macos-aarch64.tar.gz]
      linux/amd64: [unknown-linux-musl.tar.gz, linux-x86_64.tar.gz]
      linux/arm64: [aarch64-unknown-linux-gnu.tar.gz, linux-aarch64.tar.gz]
    binMap:
      windows/amd64: [rg.exe]
      darwin/amd64: [rg]
      darwin/arm64: [rg]
      linux/amd64: [rg]
      linux/arm64: [rg]
    test: rg --version
  - repo: sharkdp/fd
    name: fd
    display: fd
    description: 简单快速的 find 替代
    homepage: https://github.com/sharkdp/fd
    license: MIT
    assetMap:
      windows/amd64: [pc-windows-msvc.zip]
      darwin/amd64: [apple-darwin.tar.gz]
      darwin/arm64: [aarch64-apple-darwin.tar.gz]
      linux/amd64: [unknown-linux-musl.tar.gz]
      linux/arm64: [aarch64-unknown-linux-gnu.tar.gz]
    binMap:
      windows/amd64: [fd.exe]
      darwin/amd64: [fd]
      darwin/arm64: [fd]
      linux/amd64: [fd]
      linux/arm64: [fd]
    test: fd --version
  - repo: junegunn/fzf
    name: fzf
    display: fzf
    description: 命令行模糊查找器
    homepage: https://github.com/junegunn/fzf
    license: MIT
    assetMap:
      windows/amd64: [windows_amd64.zip]
      darwin/arm64: [darwin_arm64.tar.gz]
      darwin/amd64: [darwin_amd64.tar.gz]
      linux/amd64: [linux_amd64.tar.gz]
      linux/arm64: [linux_arm64.tar.gz]
    binMap:
      windows/amd64: [fzf.exe]
      darwin/amd64: [fzf]
      darwin/arm64: [fzf]
      linux/amd64: [fzf]
      linux/arm64: [fzf]
    test: fzf --version
  # --- 跨平台第二批：全部 5 平台自动匹配，无 assetMap 即走默认关键字 ---
  - repo: sharkdp/bat
    name: bat
    display: bat
    description: 带高亮的 cat 替代
    homepage: https://github.com/sharkdp/bat
    license: MIT
    test: bat --version
  - repo: eza-community/eza
    name: eza
    display: eza
    description: 现代 ls 替代
    homepage: https://github.com/eza-community/eza
    license: MIT
    test: eza --version
  - repo: ajeetdsouza/zoxide
    name: zoxide
    display: zoxide
    description: 更聪明的 cd
    homepage: https://github.com/ajeetdsouza/zoxide
    license: MIT
    test: zoxide --version
  - repo: starship/starship
    name: starship
    display: starship
    description: 跨 shell 极简高配提示符
    homepage: https://starship.rs
    license: ISC
    test: starship --version
  - repo: dandavison/delta
    name: delta
    display: delta
    description: git 更好看的 diff
    homepage: https://github.com/dandavison/delta
    license: MIT
    test: delta --version
  - repo: ClementTsang/bottom
    name: bottom
    display: bottom
    description: 图形化 top 替代
    homepage: https://github.com/ClementTsang/bottom
    license: MIT
    test: btm --version
    binMap:
      windows/amd64: [btm.exe]
      darwin/amd64: [btm]
      darwin/arm64: [btm]
      linux/amd64: [btm]
      linux/arm64: [btm]
  - repo: bootandy/dust
    name: dust
    display: dust
    description: 更直观的 du
    homepage: https://github.com/bootandy/dust
    license: Apache-2.0
    test: dust --version
  - repo: cli/cli
    name: gh-cli
    display: gh
    description: GitHub 官方命令行
    homepage: https://cli.github.com
    license: MIT
    test: gh --version
    binMap:
      windows/amd64: [gh.exe]
      darwin/amd64: [gh]
      darwin/arm64: [gh]
      linux/amd64: [gh]
      linux/arm64: [gh]
  - repo: jesseduffield/lazygit
    name: lazygit
    display: lazygit
    description: Git 终端 UI
    homepage: https://github.com/jesseduffield/lazygit
    license: MIT
    test: lazygit --version
  - repo: neovim/neovim
    name: neovim
    display: neovim
    description: 高配 vim
    homepage: https://neovim.io
    license: Apache-2.0
    test: nvim --version
    binMap:
      windows/amd64: [nvim.exe]
      darwin/amd64: [nvim]
      darwin/arm64: [nvim]
      linux/amd64: [nvim]
      linux/arm64: [nvim]
  - repo: jqlang/jq
    name: jq-cli
    display: jq
    description: JSON 命令行处理
    homepage: https://jqlang.github.io/jq/
    license: MIT
    test: jq --version
    binMap:
      windows/amd64: [jq.exe]
      darwin/amd64: [jq]
      darwin/arm64: [jq]
      linux/amd64: [jq]
      linux/arm64: [jq]
  - repo: mikefarah/yq
    name: yq-cli
    display: yq
    description: YAML/JSON 命令行处理
    homepage: https://github.com/mikefarah/yq
    license: MIT
    test: yq --version
    binMap:
      windows/amd64: [yq.exe]
      darwin/amd64: [yq]
      darwin/arm64: [yq]
      linux/amd64: [yq]
      linux/arm64: [yq]
