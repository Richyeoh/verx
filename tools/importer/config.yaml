# verx registry-importer 同步配置 v3：清单驱动 + 平台权威 + kind 隔离。
#
# 跑法：importer all 只拉 packages 清单里的软件（5000+，存量 registry 全量并入，不再全枚举）。
# 同名包按 os/arch 合并后一次落盘，一个软件一条 manifests/<name>/<name>.yaml。
#
# 平台权威（按顺序 fallback，有高优先级就行，不再盲覆盖）：
# - windows/amd64: github > scoop > winget  （scoop/winget 都是 Windows 源，抢同一行）
# - darwin/*, linux/*: github > brew         （brew 是唯一 mac/linux bottle 源）
# - brew cask 默认关闭：mac 专属 dmg/pkg，很多 no_check 且 fetcher 解不开（caskAllowlist 例外放行）。
#
# kind 隔离：
# - app: github/scoop/winget/brew 互斥合并，平台按权威取赢家，同源新版本覆盖
# - lib: 只有 vcpkg（libPackages 显式列表），永不和 app 合并
#
# API 预算：只拉清单，不再枚举 winget 十万包 / scoop 全桶 / star 全站。
# - scoop / winget / vcpkg：本地 git 浅克隆 + 索引过滤 + CDN 单文件，零 GitHub API。
# - brew：formulae.brew.sh 全索引拉一次 + 内存过滤，零 GitHub API。
# - github：只拉 github.repos 显式列表（owner/repo），默认空=跳过自动发现，避免 5000 包打爆配额。
# - 文本/CDN 一律不带 token。克隆根目录可用 VERX_IMPORTER_CACHE 覆盖。

version: 3

all:
  enabled: true
  workers: 16

# 平台权威顺序：合并器按此顺序取赢家，不再后写覆盖。
platforms:
  windows/amd64: [github, scoop, winget]
  darwin/amd64: [github, brew]
  darwin/arm64: [github, brew]
  linux/amd64: [github, brew]
  linux/arm64: [github, brew]

kinds:
  app: [github, scoop, winget, brew]
  lib: [vcpkg]

scoop:
  enabled: true
  workers: 16
  buckets:
    - repo: ScoopInstaller/Main
    - repo: ScoopInstaller/Extras
    - repo: ScoopInstaller/Versions

winget:
  enabled: true
  workers: 16

brew:
  enabled: true
  workers: 16
  formulaOnly: true
  caskAllowlist: []

vcpkg:
  enabled: true
  workers: 16
  libPackages: []

github:
  enabled: true
  workers: 8
  limit: 0
  repos: []

# 清单：常用软件 5000+（存量 registry 4502 全量并入 + 新增约 1000），verx 名全小写连字符，与 manifests/<name> 一致。
# 与现有 registry 同等对待：可重合、可新增，不做特殊保留；只增只减这里。
