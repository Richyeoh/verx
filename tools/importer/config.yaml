# verx registry-importer 同步配置：按软件源开关，全量默认全收。
# 跑法：importer all 按 enabled=true 的源逐个 COLLECT 进合并器，
# 同名包按 os/arch 合并后一次落盘，一个软件一条 manifests/<name>/<name>.yaml。
# 语义统一：enabled=false 直接跳过该源；limit/max*/minStars=0 或不写 = 全量/默认值；>0 = 只收前 N（调试用）。
# GITHUB_TOKEN 必配，否则列桶/列ports/搜仓库很快被限流。

all:
  enabled: true
  workers: 16

scoop:
  enabled: true
  buckets:
    - repo: ScoopInstaller/Main
      limit: 0
    - repo: ScoopInstaller/Extras
      limit: 0
    - repo: ScoopInstaller/Versions
      limit: 0

winget:
  enabled: true
  full: true
  packages: []

brew:
  enabled: true
  maxFormula: 0
  maxCask: 0

arch:
  enabled: true
  full: true
  packages: []

vcpkg:
  enabled: true
  limit: 0

github:
  enabled: false
  minStars: 2000
  limit: 0
